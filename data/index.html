<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ESP32 RGB LED & DHT20 Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <!-- Cột trái: Relay Control -->
      <section class="card relay-card">
        <h1>Relay Control</h1>

        <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="relay1" />
            <span class="slider"></span>
          </label>
          <p id="relayStatus1">Relay 1 OFF</p>
        </div>

        <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="relay2" />
            <span class="slider"></span>
          </label>
          <p id="relayStatus2">Relay 2 OFF</p>
        </div>

        <!-- <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="relay3" />
            <span class="slider"></span>
          </label>
          <p id="relayStatus3">Relay 3 OFF</p>
        </div>

        <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="relay4" />
            <span class="slider"></span>
          </label>
          <p id="relayStatus4">Relay 4 OFF</p>
        </div> -->
      </section>
 

      <!-- Schedule -->
       <section class="card schedule-card">
  <h1>Relay Scheduler</h1>

  <div class="schedule-form">

    <div class="form-row">
      <label>Chọn Relay</label>
      <select id="schRelay">
        <option value="1">Relay 1</option>
        <option value="2">Relay 2</option>
      </select>
    </div>

    <div class="form-row">
      <label>Trạng thái</label>
      <select id="schState">
        <option value="true">Bật</option>
        <option value="false">Tắt</option>
      </select>
    </div>

    <div class="form-row">
      <label>Thời gian</label>
      <div style="display:flex; gap:10px;">
        <input type="number" id="schHour" min="0" max="23" value="6">
        <input type="number" id="schMinute" min="0" max="59" value="0">
      </div>
    </div>

    <div class="form-row">
      <label>Ngày trong tuần</label>

      <div class="days-box">
  <label><input type="checkbox" value="0"> CN</label>
  <label><input type="checkbox" value="1"> T2</label>
  <label><input type="checkbox" value="2"> T3</label>
  <label><input type="checkbox" value="3"> T4</label>
  <label><input type="checkbox" value="4"> T5</label>
  <label><input type="checkbox" value="5"> T6</label>
  <label><input type="checkbox" value="6"> T7</label>
</div>

    </div>

    <button id="addScheduleBtn" class="btn">Thêm lịch</button>
  </div>

  <h3>Danh sách lịch</h3>
  <ul id="scheduleList"></ul>
</section>


      <!-- Cột phải -->
      <section class="right-column">
        <!-- Nhiệt độ và độ ẩm -->
        <div class="card">
          <h1>Temperature & Humidity</h1>
          <div class="sensor-values">
            <p>🌡️ Temperature: <span id="temp" class="value">--</span> °C</p>
            <p>💧 Humidity: <span id="humi" class="value">--</span> %</p>
          </div>
        </div>

        <!-- độ ẩm đất -->
        <div class="card">
          <h1>Soil</h1>
          <div class="sensor-values">
            <p>🌱 Soil: <span id="soil" class="value">--</span> %</p>
          </div>
        </div>
        <!-- LED RGB -->
        <!-- <div class="card">
          <h1>LED RGB Control</h1>

            </label>
            <p id="status">LED OFF</p>
          </div>
        </div> -->


      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
